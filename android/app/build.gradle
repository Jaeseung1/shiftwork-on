plugins {
    id 'com.android.application'
}

// 정식 서명 키. android/keystore.properties와 android/signing/*.jks는 저장소에 넣지 않는다(.gitignore).
// 같은 키로 빌드해야 이미 설치된 앱 위에 덮어 설치(업데이트)된다. 키를 잃어버리면 앱을 지우고 다시 깔아야 한다.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'app.shiftwork.on'
    compileSdk 34

    defaultConfig {
        applicationId 'app.gyodaeon'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.7'
        // 웹 앱 주소(예: Vercel 주소). 비우면 앱에 들어 있는 웹 파일을 쓴다.
        // 빌드할 때 바꾸려면: ./gradlew assembleDebug -PwebAppUrl=https://...
        buildConfigField 'String', 'WEB_APP_URL', "\"${project.findProperty('webAppUrl') ?: ''}\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : null
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/webassets"] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}

// 레포 루트의 웹 앱 파일을 앱 안(assets/web)에 넣는다
// 아이폰 전용 부분(단축어·잠금 화면 위젯 코드 만들기)은 갤럭시 앱에 넣지 않는다:
// sync.js의 "// <web-only>" ~ "// </web-only>" 줄과 index.html의 data-web-only 줄을 뺀다.
def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'sync.js', 'config.js', 'manifest.webmanifest', 'sw.js', 'icons/**'
    }
    into "$buildDir/generated/webassets/web"
    filesMatching('sync.js') {
        def skip = false
        filter { String line ->
            if (line.contains('// <web-only>')) { skip = true; return null }
            if (line.contains('// </web-only>')) { skip = false; return null }
            skip ? null : line
        }
    }
    filesMatching('index.html') {
        filter { String line -> line.contains('data-web-only') ? null : line }
    }
}
preBuild.dependsOn copyWebAssets
