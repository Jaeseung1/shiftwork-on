<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교대온 갤럭시 앱 받기</title>
<style>
:root{--page:#f2f4f6;--card:#fff;--ink:#191f28;--body:#4e5968;--sub:#8b95a1;--blue:#3182f6;--inset:#f2f4f6}
@media(prefers-color-scheme:dark){:root{--page:#0f1115;--card:#1a1d24;--ink:#f2f4f6;--body:#b0b8c1;--sub:#8b95a1;--blue:#4795ff;--inset:#232730}}
body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em;word-break:keep-all}
main{max-width:480px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.03em}
.sub{color:var(--body);margin:0 0 20px;line-height:1.5}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.ver{color:var(--sub);font-size:14px;margin:10px 0 0;text-align:center}
ol{margin:0;padding-left:20px;line-height:1.7;color:var(--body);font-size:15px}
h2{font-size:17px;margin:0 0 10px}
</style></head>
<body><main>
<h1>교대온 갤럭시 앱</h1>
<p class="sub">홈 화면 위젯(4x1·2x1·1x1)이 있는 갤럭시용 앱이에요.</p>
<div class="card"><a class="btn" id="dl" href="#">앱 받기</a><p class="ver" id="ver">버전 확인 중…</p></div>
<div class="card"><h2>설치·업데이트</h2><ol>
<li>위 버튼으로 파일을 받고, 알림이나 내 파일 → 다운로드에서 열어요.</li>
<li>이미 깔려 있으면 <b>지우지 말고</b> 그대로 설치해요. 근무표와 위젯이 남아요.</li>
<li>"출처를 알 수 없는 앱" 허용을 물으면 허용해요.</li>
<li>Play 프로텍트 경고가 뜨면 <b>자세히 보기 → 그래도 설치</b>를 눌러요. Play 스토어를 거치지 않은 앱이라 뜨는 경고예요.</li>
</ol></div>
</main>
<script>
fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then((j) => {
  document.getElementById('dl').href = j.url
  document.getElementById('ver').textContent = `버전 ${j.versionName}` + (j.notes ? ` · ${j.notes}` : '')
}).catch(() => { document.getElementById('ver').textContent = '버전 정보를 불러오지 못했어요' })
</script>
</body></html>
